{% extends "profile/base_profile.html" %}

{% block page_title %}Change password{% endblock %}
{% block page_sub %}Use a strong password that you do not use anywhere else.{% endblock %}

{% block profile_content %}

<div class="eco-panel">
    <form method="POST">
        {% csrf_token %}

        {% include "profile/_form_fields.html" %}

        <div class="eco-actions">
            <button type="submit" class="eco-btn eco-btn--accent">Update password</button>
            <a href="{% url 'profile' %}" class="eco-btn eco-btn--ghost">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
