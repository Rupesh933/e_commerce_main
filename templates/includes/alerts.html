{% if messages %}
<div id="alert-messages" class="container mt-3">
    {% for message in messages %}
    <div id="message" class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show shadow-sm" role="alert">
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
        {% if message.tags == 'error' or message.tags == 'danger' %}
            <strong><i class="fa fa-exclamation-circle mr-1"></i>Error: </strong>
        {% elif message.tags == 'success' %}
            <strong><i class="fa fa-check-circle mr-1"></i>Success: </strong>
        {% elif message.tags == 'warning' %}
            <strong><i class="fa fa-exclamation-triangle mr-1"></i>Warning: </strong>
        {% elif message.tags == 'info' %}
            <strong><i class="fa fa-info-circle mr-1"></i>Info: </strong>
        {% endif %}
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
