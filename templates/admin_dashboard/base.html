{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopping Mart Admin</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
 
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Admin CSS -->
    <link rel="stylesheet" href="{% static 'css/admin.css' %}" />
  </head>

  <body>
    <div class="admin-layout">
      <!-- SIDEBAR -->
      <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <a href="{% url 'admin_dashboard' %}" class="brand">
            <div class="brand-logo">👗</div>

            <div class="brand-content">
                <span class="brand-name"> Shopping Mart </span>

                <span class="brand-subtitle"> ADMIN PANEL </span>
            </div>
            </a>
        </div>

        <nav class="sidebar-navigation">
            <div class="navigation-section">
            <span class="navigation-title"> MAIN MENU </span>

            <a href="{% url 'admin_dashboard' %}" class="navigation-link active">
                <span class="navigation-icon">
                <i class="fa-solid fa-grid-2"></i>
                </span>

                <span class="navigation-text"> Dashboard </span>
            </a>

            <a href="{% url 'admin_products' %}" class="navigation-link">
                <span class="navigation-icon">
                <i class="fa-solid fa-box"></i>
                </span>

                <span class="navigation-text"> Products </span>
            </a>

            <a href="#" class="navigation-link">
                <span class="navigation-icon">
                <i class="fa-solid fa-layer-group"></i>
                </span>

                <span class="navigation-text"> Categories </span>
            </a>

            <a href="{% url 'admin_orders' %}" class="navigation-link">
                <span class="navigation-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                </span>

                <span class="navigation-text"> Orders </span>

                <span class="navigation-badge"> 12 </span>
            </a>

            <a href="{% url 'admin_customers' %}" class="navigation-link">
                <span class="navigation-icon">
                <i class="fa-solid fa-users"></i>
                </span>
                <span class="navigation-text"> Customers </span>
            </a>

            <a href="{% url 'admin_payments' %}" class="navigation-link">
                <span class="navigation-icon">
                <i class="fa-solid fa-credit-card"></i>
                </span>

                <span class="navigation-text"> Payments </span>
            </a>
            </div>

            <div class="navigation-section">
            <span class="navigation-title"> STORE </span>

            <a href="{% url 'admin_banner' %}" class="navigation-link">
                <span class="navigation-icon">
                <i class="fa-solid fa-image"></i>
                </span>

                <span class="navigation-text"> Banners </span>
            </a>

            <a href="#" class="navigation-link">
                <span class="navigation-icon">
                <i class="fa-solid fa-sliders"></i>
                </span>

                <span class="navigation-text"> Variations </span>
            </a>
            </div>
        </nav>

        <div class="sidebar-bottom">
            <a href="{% url 'home' %}" class="sidebar-bottom-link">
            <i class="fa-solid fa-store"></i>

            <span> View Store </span>
            </a>

            <a href="#" class="sidebar-bottom-link logout">
            <i class="fa-solid fa-right-from-bracket"></i>

            <span> Logout </span>
            </a>
        </div>
        </aside>


      <!-- MAIN AREA -->

      <main class="admin-main">
        <!-- Topbar -->

        <header class="admin-topbar">
          <div class="topbar-left">
            <button class="mobile-menu-button">
              <i class="fa-solid fa-bars"></i>
            </button>

            <div class="topbar-search">
              <i class="fa-solid fa-magnifying-glass"></i>

              <input type="text" placeholder="Search..." />
            </div>
          </div>

          <div class="topbar-right">
            <!-- Notification -->

            <button class="topbar-icon-button">
              <i class="fa-regular fa-bell"></i>
            </button>

            <div class="topbar-divider"></div>

            <!-- Admin User -->

            <div class="admin-user">
              <div class="admin-user-avatar">R</div>

              <div class="admin-user-details">
                <strong> Rupesh Rana </strong>

                <span> Administrator </span>
              </div>

              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>
        </header>

        <!-- PAGE CONTENT -->

        <div class="admin-content">
          {% block content %} {% endblock content %}
        </div>
      </main>
    </div>
  </body>
</html>
